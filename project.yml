name: PhotoClear
options:
  minimumXcodeGenVersion: 2.38
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: com.maguc98.PhotoClear
    INFOPLIST_KEY_CFBundleDisplayName: PhotoClear
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: PhotoClear needs access to photos you choose to enhance locally.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: PhotoClear saves enhanced images to your photo library.
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  PhotoClear:
    type: application
    platform: iOS
    sources:
      - path: PhotoClear
        excludes:
          - Models/README.md
    settings:
      base:
        PRODUCT_NAME: PhotoClear
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
