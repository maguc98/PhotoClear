name: iOS Build

concurrency:
  group: photoclear-ios-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package iOS app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download and verify bundled AI model
        run: bash Scripts/download-model.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project PhotoClear.xcodeproj \
            -scheme PhotoClear \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project PhotoClear.xcodeproj \
            -scheme PhotoClear \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Embed precompiled DAT2 detail model
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/PhotoClear.app"
          MODEL_SOURCE="PhotoClear/Models/DAT2_Detail.mlmodelc"
          test -d "$APP_PATH"
          test -d "$MODEL_SOURCE"
          mkdir -p "$APP_PATH/Models"
          ditto "$MODEL_SOURCE" "$APP_PATH/Models/DAT2_Detail.mlmodelc"
          test -d "$APP_PATH/Models/DAT2_Detail.mlmodelc"

      - name: Verify embedded DAT2 model
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/PhotoClear.app"
          MODEL_PATH="$APP_PATH/Models/DAT2_Detail.mlmodelc"
          test -d "$MODEL_PATH"
          printf 'Found embedded DAT2 model: %s\\n' "$MODEL_PATH"

      - name: Smoke-test DAT2 Core ML prediction
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/PhotoClear.app"
          swift Scripts/verify-dat2-model.swift "$APP_PATH/Models/DAT2_Detail.mlmodelc"

      - name: Verify embedded Core ML model
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/PhotoClear.app"
          test -d "$APP_PATH"
          MODEL_PATH="$(find "$APP_PATH" -type d -name 'RealESRGAN_x4plus_fp16.mlmodelc' -print -quit)"
          if [[ -z "$MODEL_PATH" ]]; then
            echo "Compiled Core ML model was not found in the app bundle." >&2
            find "$APP_PATH" -maxdepth 5 -print >&2
            exit 1
          fi
          printf 'Found compiled model: %s\n' "$MODEL_PATH"

      - name: Smoke-test Core ML model prediction
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/PhotoClear.app"
          MODEL_PATH="$(find "$APP_PATH" -type d -name 'RealESRGAN_x4plus_fp16.mlmodelc' -print -quit)"
          test -n "$MODEL_PATH"
          swift Scripts/verify-coreml-model.swift "$MODEL_PATH"

      - name: Package unsigned iOS IPA
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/PhotoClear.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr PhotoClear-unsigned.ipa Payload

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhotoClear-unsigned-IPA
          path: PhotoClear-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
